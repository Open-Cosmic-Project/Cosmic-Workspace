[workspace]
resolver = "2"
members = [
  "core/[!.]*",
  "daemons/[!.]*",
  "ui/[!.]*",
  "libs/[!.]*",
  "pkg/[!.]*",
  "sdk/[!.]*",
  "tools/[!.]*",
]

# Carpetas que no son crates de Rust (o que aún no compilan)
exclude = [
  "core/corchd",        # Go
  "ui/creationde",      # C++ / CMake
  "tools/bin",          # binarios compilados
  "tools/cosmic-build", # Go y C++
  "tools/cad",          # comentado hasta que compile
]

# Hito 1 acordado (CosmicOS v0.2.8 / 7.7)
default-members = [
  "core/cinitd",
  "core/kernel.root",
  "core/clauncher",
  "pkg/sps",
  "libs/cosmic-core",
  "tools/cosmic-repo",
]

[workspace.package]
version = "0.0.1"
edition.workspace = true
authors = ["OpenCosmicProject Contributors"]
license = "GPL-3.0,BSD-3-Clause,MIT,LGPL-2.1,CC0,AGPL-3.0"
repository = "https://github.com/Open-Cosmic-Project"

[workspace.dependencies]
cosmic-core = { path = "libs/cosmic-core" }
cosmic-usb = { path = "libs/cosmic-usb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = [
  "process",
  "socket",
  "user",
  "signal",
  "mount",
  "fs",
] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
cc = "1.2"
